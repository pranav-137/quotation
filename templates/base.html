<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quotation Maker{% endblock %}</title>
  <style>
    :root { --bg:#f5f7fa; --card:#fff; --text:#1c2733; --muted:#64748b; --accent:#1f4e79; --line:#dbe2ea; --danger:#b42318; --ok:#067647; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#10161d; --card:#18212b; --text:#e6edf3; --muted:#93a1b1; --accent:#5aa2e0; --line:#2a3644; --danger:#f97066; --ok:#47cd89; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    header.top { background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    header.top a.brand { font-weight:700; color:var(--accent); text-decoration:none; font-size:1.1rem; }
    header.top .who { color:var(--muted); font-size:.9rem; display:flex; gap:12px; align-items:center; }
    main { max-width:980px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:18px; }
    h1 { font-size:1.4rem; margin:0 0 14px; } h2 { font-size:1.05rem; margin:0 0 12px; color:var(--accent); }
    label { display:block; font-weight:600; font-size:.88rem; margin-bottom:4px; }
    input[type=text], input[type=email], input[type=date], input[type=number], select, textarea, input[type=file] {
      width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
    textarea { resize:vertical; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
    .field .help, .muted { color:var(--muted); font-size:.82rem; }
    .errorlist { list-style:none; margin:4px 0 0; padding:0; color:var(--danger); font-size:.85rem; }
    .btn { display:inline-block; padding:8px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
    .btn.secondary { background:transparent; color:var(--accent); }
    .btn.danger { background:transparent; color:var(--danger); border-color:var(--danger); }
    .btn.small { padding:4px 10px; font-size:.85rem; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .messages { list-style:none; padding:0; margin:0 0 16px; }
    .messages li { padding:10px 14px; border-radius:6px; margin-bottom:8px; background:var(--card); border:1px solid var(--line); }
    .messages .success { border-color:var(--ok); } .messages .error { border-color:var(--danger); }
    table.data { width:100%; border-collapse:collapse; }
    table.data th, table.data td { padding:8px 6px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
    table.data th { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    .num { text-align:right !important; white-space:nowrap; }
    .tbl-wrap { overflow-x:auto; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    .badge.expired { color:var(--danger); border-color:var(--danger); }
    .auth { max-width:420px; margin:60px auto; }
    form.inline { display:inline; }
    .hero { text-align:center; padding:48px 16px 32px; }
    .hero h1 { font-size:2rem; margin-bottom:10px; } .hero p { color:var(--muted); max-width:560px; margin:0 auto 22px; }
    .features { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    .btn.google { background:#fff; color:#1f1f1f; border:1px solid #747775; width:100%; text-align:center; display:flex; gap:10px; justify-content:center; align-items:center; }
    .divider { text-align:center; color:var(--muted); margin:16px 0; font-size:.85rem; display:flex; align-items:center; gap:10px; }
    .divider::before, .divider::after { content:""; flex:1; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="{% url 'quotes:home' %}">Quotation Maker</a>
    {% if user.is_authenticated %}
    <div class="who">
      <a href="{% url 'quotes:maker' %}">Create quotation</a>
      <span>{{ user.email }}</span>
      <form method="post" action="{% url 'accounts:logout' %}" class="inline">{% csrf_token %}
        <button class="btn secondary small" type="submit">Sign out</button>
      </form>
      <a href="{% url 'quotes:contact' %}">Contact us</a>
    </div>
    {% else %}
    <div class="who"><a class="btn small" href="{% url 'accounts:login' %}">Sign in</a></div>
    {% endif %}
  </header>
  <main>
    {% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
